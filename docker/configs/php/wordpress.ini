; Limiti adatti a un sito editoriale con immagini e a un tema pesante come Impreza
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120

; Errori nei log del container («docker logs»), mai nella pagina: senza php.ini PHP li mostra ai
; visitatori, con i percorsi del server, e non li registra da nessuna parte (oc:8757, avviso di us-core
; sulla 404 inglese di UAT)
display_errors = Off
log_errors = On
error_log = /dev/stderr
